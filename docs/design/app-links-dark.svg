one がつながっていないとき</text><rect x="40" y="302" width="560" height="52" rx="10" fill="#2A2A2C" stroke="#3A3A3C" stroke-width="1"/><rect x="60" y="321" width="28" height="18" rx="3" fill="none" stroke="#F2F2F7" stroke-width="2.2"/><rect x="70" y="340" width="8" height="3" rx="0" fill="#F2F2F7"/><rect x="66" y="343" width="16" height="2" rx="1" fill="#F2F2F7"/><circle cx="88" cy="318" r="5" fill="#4FD06A"/><text x="100" y="330" fill="#F2F2F7" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" font-weight="700" text-anchor="start">Backup Stage Mac</text><text x="100" y="347" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="10" font-weight="400" text-anchor="start">Live ✓ ・ 2 ms</text><rect x="246" y="318" width="16" height="28" rx="4" fill="none" stroke="#8E8E93" stroke-width="2.2"/><rect x="251" y="341" width="6" height="2" rx="1" fill="#8E8E93"/><text x="280" y="330" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" font-weight="700" text-anchor="start">iPhone なし</text><text x="280" y="346" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="10" font-weight="400" text-anchor="start">（受け付けはオン）</text><text x="40" y="384" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・バックアップの Mac では「iPhone はメインの Mac に接続中（1台）」と出します。</text><text x="40" y="404" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・Apple Watch は iPhone から知らせを受けて出します（Mac には直接つながりません）。</text><text x="40" y="424" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・Watch が iPhone から離れて届かないときは、黄色で「Apple Watch：届きません」。</text><rect x="640" y="20" width="580" height="190" rx="14" fill="#1E1E20" stroke="#3A3A3C" stroke-width="1"/><text x="660" y="48" fill="#F2F2F7" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="13" font-weight="800" text-anchor="start">iPhone の上の帯（Watch の印を足す）</text><rect x="660" y="64" width="540" height="58" rx="8" fill="#121214"/><circle cx="680" cy="80" r="6" fill="#4FD06A"/><text x="694" y="84" fill="#F2F2F7" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="16" font-weight="700" text-anchor="start">Main Stage Mac</text><rect x="832" y="68" width="12" height="4" rx="2" fill="#4FD06A"/><rect x="832" y="90" width="12" height="4" rx="2" fill="#4FD06A"/><rect x="829" y="71" width="18" height="19" rx="6" fill="none" stroke="#4FD06A" stroke-width="2.2"/><text x="694" y="110" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="12" font-weight="400" text-anchor="start">バックアップ ✓ · Live ✓ · 2 ms</text><text x="1000" y="95" fill="#6E6E73" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">（再生・停止・テンポ… は今のまま）</text><text x="660" y="140" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・Apple Watch がつながっていると、名前の横に緑の Watch の印</text><text x="660" y="158" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・届かないときは黄色、Watch に入っていないときは出さない</text><text x="660" y="176" fill="#AEAEB2" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif" font-size="11" font-weight="400" text-anchor="start">・押すと「設定」の「接続」を開く</text><rect x="640" y="226" width="580" height="394" rx="14" fill="#1E1E20" stroke="#3A3A3C" stroke-width="1"/><text x="660" y="254" fill="#F2F2F7" font-family="-apple-system, 'Hiragino Sa