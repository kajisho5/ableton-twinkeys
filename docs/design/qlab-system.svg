l="none" stroke="#3DFF7A" stroke-width="4" marker-end="url(#ar)"/><text x="660" y="430" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#3DFF7A" text-anchor="start">メインの Mac にだけつなぐ</text><rect x="80" y="1190" width="2320" height="150" rx="20" fill="#060606" stroke="#2A2A2A" stroke-width="2" /><text x="120" y="1250" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">音の出口：どちらの QLab の音も卓へ。切り替えは卓で（TwinKeys は音を切り替えない。Yamaha 卓の引き継ぎは 2.4 の試験機能）</text><text x="120" y="1300" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#9A9A9A" text-anchor="start">メインが止まったら：iPhone で「バックアップに切り替える」→ バックアップの Mac の TwinKeys が受け口になる（今と同じ）</text></svg>
