<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1400" viewBox="0 0 2480 1400"><rect x="0" y="0" width="2480" height="1400" rx="0" fill="#000" /><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><marker id="ar" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L22 11 L0 22 Z" fill="#3DFF7A"/></marker><marker id="ab" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L22 11 L0 22 Z" fill="#8AB4FF"/></marker><marker id="ay" markerWidth="22" markerHeight="22" refX="18" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L22 11 L0 22 Z" fill="#FFB020"/></marker></defs><text x="60" y="90" font-family="Noto Sans CJK JP" font-size="52" font-weight="800" fill="#FFF" text-anchor="start">QLab モードのつながり</text><text x="60" y="146" font-family="Noto Sans CJK JP" font-size="28" font-weight="400" fill="#A0A4AD" text-anchor="start">どちらの Mac も、自分の QLab にだけ OSC を送ります。Mac どうしは今の暗号化した回線のまま</text><rect x="80" y="380" width="820" height="760" rx="26" fill="#060606" stroke="#2A2A2A" stroke-width="3" /><circle cx="120" cy="430" r="9" fill="#3DFF7A" filter="url(#g)"/><circle cx="120" cy="430" r="6" fill="#3DFF7A"/><text x="144" y="440" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start" letter-spacing="3">MAIN</text><text x="120" y="490" font-family="Noto Sans CJK JP" font-size="34" font-weight="700" fill="#EDEDED" text-anchor="start">Main Stage Mac</text><rect x="120" y="530" width="740" height="170" rx="16" fill="#060606" stroke="#3DFF7A" stroke-width="2" /><text x="150" y="585" font-family="JetBrains Mono" font-size="32" font-weight="700" fill="#3DFF7A" text-anchor="start">TwinKeys</text><text x="150" y="630" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#9A9A9A" text-anchor="start">キューのキー・iPhone の受け口・2台の確認</text><text x="150" y="670" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#9A9A9A" text-anchor="start">QLab 接続（OSC/TCP、この Mac の中だけ）</text><rect x="120" y="840" width="740" height="250" rx="16" fill="#060606" stroke="#3D8BFF" stroke-width="2" /><text x="150" y="895" font-family="JetBrains Mono" font-size="32" font-weight="700" fill="#3D8BFF" text-anchor="start">QLab 5</text><text x="150" y="940" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#9A9A9A" text-anchor="start">ワークスペース sample-show（同じファイル）</text><text x="150" y="980" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#9A9A9A" text-anchor="start">OSC Access：パスコード（見る・操作）</text><text x="150" y="1020" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">再生位置 13  ·  動いているキュー 2</text><line x1="380" y1="702" x2="380" y2="832" stroke="#3DFF7A" stroke-width="4" marker-end="url(#ar)"/><line x1="600" y1="836" x2="600" y2="708" stroke="#8AB4FF" stroke-width="4" marker-end="url(#ab)"/><text x="410" y="760" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#3DFF7A" text-anchor="start">/go など</text><text x="410" y="792" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#3DFF7A" text-anchor="start">127.0.0.1:53000</text><text x="630" y="760" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#8AB4FF" text-anchor="start">返事・/update</text><text x="630" y="792" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#8AB4FF" text-anchor="start">（同じ TCP）</text><rect x="1580" y="380" width="820" height="760" rx="26" fill="#060606" stroke="#2A2A2A" stroke-width="3" /><circle cx="1620" cy="430" r="9" fill="#3DFF7A" filter="url(#g)"/><circle cx="1620" cy="430" r="6" fill="#3DFF7A"/><text x="1644" y="440" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start" letter-spacing="3">BACKUP</text><text x="1620" y="490" font-family