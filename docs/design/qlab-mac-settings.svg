<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1640" viewBox="0 0 2480 1640"><rect x="0" y="0" width="2480" height="1640" rx="0" fill="#141518" /><rect x="40" y="40" width="1220" height="1560" rx="24" fill="#1E1F23" stroke="#3A3B41" stroke-width="2" /><text x="80" y="110" font-family="Noto Sans CJK JP" font-size="40" font-weight="800" fill="#EDEDED" text-anchor="start">設定 — QLab</text><text x="80" y="158" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">両方の Mac が、それぞれ自分の QLab に OSC で命令します（この Mac の中だけ、TCP 53000）</text><text x="80" y="226" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="start">TwinKeys が動かすもの</text><rect x="80" y="246" width="222" height="58" rx="10" fill="#2A2B30" stroke="#3A3B41" stroke-width="2" /><text x="191" y="284" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="middle">Ableton Live</text><rect x="310" y="246" width="222" height="58" rx="10" fill="#5AA9FF" /><text x="421" y="284" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#FFF" text-anchor="middle">QLab</text><rect x="540" y="246" width="222" height="58" rx="10" fill="#2A2B30" stroke="#3A3B41" stroke-width="2" /><text x="651" y="284" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="middle">両方</text><text x="800" y="284" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">「両方」：Live と QLab の両方へ</text><text x="80" y="360" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="start">この Mac の QLab</text><rect x="80" y="380" width="1140" height="210" rx="14" fill="#2A2B30" stroke="#3A3B41" stroke-width="2" /><circle cx="120" cy="430" r="8" fill="#3DD26A"/><text x="144" y="439" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#3DD26A" text-anchor="start">QLab 5.6.5 に接続済み（TCP 127.0.0.1:53000）</text><text x="120" y="492" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">ワークスペース</text><rect x="120" y="506" width="420" height="56" rx="10" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="140" y="544" font-family="JetBrains Mono" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="start">sample-show</text><text x="518" y="544" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="580" y="492" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">パスコード（4桁）</text><rect x="580" y="506" width="200" height="56" rx="10" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="600" y="544" font-family="JetBrains Mono" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">● ● ● ●</text><text x="820" y="492" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">使える権限</text><circle cx="830" cy="534" r="8" fill="#3DD26A"/><text x="848" y="542" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#EDEDED" text-anchor="start">見る</text><circle cx="930" cy="534" r="8" fill="#3DD26A"/><text x="948" y="542" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#EDEDED" text-anchor="start">操作</text><circle cx="1030" cy="534" r="8" fill="#555"/><text x="1048" y="542" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">編集（不要）</text><text x="80" y="628" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">パスコードはこの Mac のキーチェーンに保存します（もう片方の Mac には送りません）。</text><text x="80" y="662" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">「操作（control）」の権限がないと GO できません。QLab の 設定 → Network → OSC Access で付けます。</text><text x="80" y="720" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="start">キューのキー → QLab の動き</text><rect x="80" y="740" width="1140" height="380" rx="14" fill="#2A2B30" stroke="#3A3B41" stroke-width="2" /><text x="120" y="784" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">キー</text><text x="340" y="784" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">QLab の動き</text><text x="680" y="784" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">説明</text><rect x="120" y="802" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="830" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">Space</text><rect x="340" y="802" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="830" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">GO</text><text x="618" y="830" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="830" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">次のキューを GO（2台）</text><rect x="120" y="850" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="878" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">↓</text><rect x="340" y="850" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="878" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">次へ</text><text x="618" y="878" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="878" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">再生位置を1つ下へ</text><rect x="120" y="898" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="926" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">↑</text><rect x="340" y="898" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="926" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">前へ</text><text x="618" y="926" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="926" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">再生位置を1つ上へ</text><rect x="120" y="946" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="974" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">Esc</text><rect x="340" y="946" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="974" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">Panic</text><text x="618" y="974" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="974" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">2台とも Panic（もう一度で即停止）</text><rect x="120" y="994" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="1022" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">A</text><rect x="340" y="994" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="1022" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="start">キュー 90 を GO</text><text x="618" y="1022" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="1022" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">番号のキューへ移って GO</text><rect x="120" y="1042" width="150" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="195" y="1070" font-family="JetBrains Mono" font-size="22" font-weight="700" fill="#EDEDED" text-anchor="middle">Return</text><rect x="340" y="1042" width="300" height="40" rx="8" fill="#1A1B1F" stroke="#3A3B41" stroke-width="2" /><text x="356" y="1070" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#A0A4AD" text-anchor="start">なし</text><text x="618" y="1070" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="end">▾</text><text x="680" y="1070" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">（Live だけ）</text><text x="80" y="1170" font-family="Noto Sans CJK JP" font-size="26" font-weight="700" fill="#EDEDED" text-anchor="start">2台をそろえる</text><rect x="90" y="1202" width="28" height="28" rx="6" fill="#5AA9FF" /><path d="M96 1216 l6 6 l11 -13" fill="none" stroke="#FFF" stroke-width="4"/><text x="132" y="1224" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">バックアップの再生位置をメインに合わせる（おすすめ）</text><text x="132" y="1258" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">メインで再生位置が動くたび、バックアップの QLab も同じ番号のキューへ</text><rect x="90" y="1288" width="28" height="28" rx="6" fill="#5AA9FF" /><path d="M96 1302 l6 6 l11 -13" fill="none" stroke="#FFF" stroke-width="4"/><text x="132" y="1310" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">iPhone で見ていた「次」と違うときは GO しない</text><text x="132" y="1344" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">Mac の前で誰かが再生位置を動かした直後の、思わぬ GO を防ぎます</text><rect x="90" y="1374" width="28" height="28" rx="6" fill="#1A1B1F" stroke="#6A6D75" stroke-width="2" /><text x="132" y="1396" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">MIDI ノートも出す（QLab だけのとき）</text><text x="132" y="1430" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#FFB020" text-anchor="start">QLab の Workspace MIDI に TwinKeys を割り当てていると、2回動きます</text><text x="80" y="1500" font-family="Noto Sans CJK JP" font-size="20" font-weight="400" fill="#A0A4AD" text-anchor="start">キューの番号で2台を対応させます。番号のないキューは「次へ・前へ」だけで動かせます。</text><rect x="1300" y="40" width="1140" height="560" rx="24" fill="#1E1F23" stroke="#3A3B41" stroke-width="2" /><text x="1340" y="110" font-family="Noto Sans CJK JP" font-size="36" font-weight="800" fill="#EDEDED" text-anchor="start">2台の QLab</text><text x="1340" y="170" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#A0A4AD" text-anchor="start"></text><text x="1700" y="170" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#A0A4AD" text-anchor="start">Main Stage Mac</text><text x="2060" y="170" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#A0A4AD" text-anchor="start">Backup Stage Mac</text><line x1="1340" y1="188" x2="2400" y2="188" stroke="#3A3B41"/><text x="1340" y="218" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">QLab</text><text x="1700" y="218" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">5.6.5 接続済み</text><text x="2060" y="218" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">5.6.5 接続済み</text><line x1="1340" y1="232" x2="2400" y2="232" stroke="#3A3B41"/><text x="1340" y="262" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">ワークスペース</text><text x="1700" y="262" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">sample-show</text><text x="2060" y="262" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">sample-show</text><line x1="1340" y1="276" x2="2400" y2="276" stroke="#3A3B41"/><text x="1340" y="306" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">権限</text><text x="1700" y="306" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">見る・操作</text><text x="2060" y="306" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">見る・操作</text><line x1="1340" y1="320" x2="2400" y2="320" stroke="#3A3B41"/><text x="1340" y="350" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">キューの数</text><text x="1700" y="350" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">48</text><text x="2060" y="350" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">48 同じ</text><line x1="1340" y1="364" x2="2400" y2="364" stroke="#3A3B41"/><text x="1340" y="394" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">再生位置</text><text x="1700" y="394" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">13 雷鳴 1</text><text x="2060" y="394" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">13 同じ</text><line x1="1340" y1="408" x2="2400" y2="408" stroke="#3A3B41"/><text x="1340" y="438" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">動いているキュー</text><text x="1700" y="438" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">2</text><text x="2060" y="438" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#EDEDED" text-anchor="start">2</text><line x1="1340" y1="452" x2="2400" y2="452" stroke="#3A3B41"/><text x="1340" y="482" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#A0A4AD" text-anchor="start">本番モード</text><text x="1700" y="482" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#3DD26A" text-anchor="start">オン</text><text x="2060" y="482" font-family="Noto Sans CJK JP" font-size="24" font-weight="700" fill="#FFB020" text-anchor="start">オフ</text><rect x="1340" y="526" width="1060" height="56" rx="10" fill="#2A2210" stroke="#FFB020" stroke-width="2" /><text x="1360" y="563" font-family="Noto Sans CJK JP" font-size="22" font-weight="700" fill="#FFB020" text-anchor="start">Backup Stage Mac の QLab が本番モード（Show Mode）ではありません</text><rect x="1300" y="630" width="1140" height="520" rx="24" fill="#1E1F23" stroke="#3A3B41" stroke-width="2" /><text x="1340" y="700" font-family="Noto Sans CJK JP" font-size="36" font-weight="800" fill="#EDEDED" text-anchor="start">GO のとき（iPhone・キューのキー）</text><text x="1340" y="770" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">1. メインの QLab の再生位置が、iPhone で見ていた「13」か確かめる</text><text x="1340" y="828" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">2. メインの QLab に /workspace/{id}/go（返事を受け取る設定で）</text><text x="1340" y="886" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">3. 同時にバックアップの Mac へ「13 で GO」を送る（暗号化、0.1 秒ごとに送り直し）</text><text x="1340" y="944" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">4. バックアップは自分の再生位置が 13 なら GO。違えば 13 へ移して GO</text><text x="1340" y="1002" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">5. 両方の返事と、再生位置が 14 に進んだことで「届いた ✓」</text><text x="1340" y="1060" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#FF3B30" text-anchor="start">   0.3 秒たっても返事がなければ赤で「バックアップから返事がありません」</text><text x="1340" y="1120" font-family="Noto Sans CJK JP" font-size="22" font-weight="400" fill="#A0A4AD" text-anchor="start">GO 以外：次へ・前へ・Panic・Stop も同じ道で2台に届けます</text><rect x="1300" y="1180" width="1140" height="420" rx="24" fill="#1E1F23" stroke="#3A3B41" stroke-width="2" /><text x="1340" y="1250" font-family="Noto Sans CJK JP" font-size="36" font-weight="800" fill="#EDEDED" text-anchor="start">困ったときの表示</text><circle cx="1356" cy="1312" r="8" fill="#FF3B30"/><text x="1380" y="1320" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">QLab が開いていません（TCP 53000 につながらない）</text><circle cx="1356" cy="1368" r="8" fill="#FF3B30"/><text x="1380" y="1376" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">パスコードが違います（QLab は間違いが続くと待たせます）</text><circle cx="1356" cy="1424" r="8" fill="#FFB020"/><text x="1380" y="1432" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">権限が「見る」だけ：表示はできますが GO できません</text><circle cx="1356" cy="1480" r="8" fill="#FFB020"/><text x="1380" y="1488" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">ワークスペースが2つ開いています：使うものを選んでください</text><circle cx="1356" cy="1536" r="8" fill="#FFB020"/><text x="1380" y="1544" font-family="Noto Sans CJK JP" font-size="24" font-weight="400" fill="#EDEDED" text-anchor="start">バックアップのキューが違います（48 と 47）　［違いを見る］</text></svg>
