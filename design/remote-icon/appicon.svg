<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TwinKeys Remote app icon (full-bleed square; iOS applies the corner mask). Mark: "Linked Fader". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3E5E"/>
      <stop offset="1" stop-color="#0F1522"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA9C6"/>
      <stop offset="1" stop-color="#7B8AA8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- rails -->
  <rect x="349.5" y="177" width="65" height="650" rx="32.5" fill="url(#rail)"/>
  <rect x="609.5" y="177" width="65" height="650" rx="32.5" fill="url(#rail)"/>
  <!-- cap shadow -->
  <rect x="249" y="431" width="526" height="182" rx="45.5" fill="#000000" opacity="0.45" filter="url(#shadow)"/>
  <!-- cap: white half (this Mac) + blue half (the backup), one piece -->
  <rect x="239" y="411" width="546" height="182" rx="45.5" fill="#FFFFFF" clip-path="url(#left)"/>
  <rect x="239" y="411" width="546" height="182" rx="45.5" fill="#71B1FF" clip-path="url(#right)"/>
  <!-- groove -->
  <rect x="291" y="489" width="442" height="26" rx="13" fill="#1E2840"/>
</svg>
