name: Release

# Two ways to publish a release (the zip of the universal TwinKeys.app is attached):
#  1. Change the VERSION file (for example to 0.2.0) and push. If release v0.2.0 does not
#     exist yet, it is built, the tag is created on that commit and the release is published.
#  2. Push a tag like v1.0.0, or run this workflow by hand with an existing tag.
on:
  push:
    branches: ["**"]
    paths: ["VERSION"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Decide the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a valid version: $TAG"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # A VERSION push for a version that is already released does nothing.
          if [ "${{ github.ref_type }}" = "branch" ] && [ -z "${{ github.event.inputs.tag }}" ] \
             && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        if: env.SKIP != '1'
        run: swift test
      - name: Build
        if: env.SKIP != '1'
        run: scripts/build-app.sh "${TAG#v}" "${GITHUB_RUN_NUMBER}"
      - name: Create or update the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions and versions with a suffix (e.g. 1.0.0-beta.1) are marked as pre-releases.
          PRE=""
          case "$TAG" in v0.*|*-*) PRE="--prerelease" ;; esac
          cat > notes.md <<'NOTES'
          Universal build for Apple silicon and Intel Macs (macOS 13 Ventura or later).

          **Unofficial third-party tool.** Not made or endorsed by Ableton.

          - Not notarized. First launch: see README > Download and first launch (macOS 15 or later: System Settings > Privacy & Security > Open Anyway).
          - The main Mac needs Input Monitoring; both Macs need Local Network access (macOS 15 or later).
          - Turn off the DAW's own computer MIDI keyboard on the main Mac.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            # Creates the tag on this exact commit if it does not exist yet.
            gh release create "$TAG" dist/*.zip $PRE --target "$GITHUB_SHA" \
              --title "TwinKeys $TAG" --notes-file notes.md
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
