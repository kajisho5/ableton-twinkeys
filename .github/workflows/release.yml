name: Release

# Push a tag like v1.0.0 to build TwinKeys.app (universal) and attach the zip to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Unit tests
        run: swift test
      - name: Build
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          scripts/build-app.sh "${TAG#v}" "${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "TwinKeys $TAG" --notes "Universal build (Apple silicon and Intel). Not notarized: see README > First launch."
          fi
