name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per pull request: a run that has started always finishes (its result is needed),
# and of the pushes waiting behind it only the newest runs (Mac runners are few and slow).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build, test and package (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit tests
        timeout-minutes: 10
        run: swift test
      - name: Build universal .app
        timeout-minutes: 10
        run: scripts/build-app.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_NUMBER}"
      - name: Check bundle
        run: |
          plutil -p dist/TwinKeys.app/Contents/Info.plist
          ls -l dist/TwinKeys.app/Contents/Resources
      - name: Launch smoke test (starts, stays up 5 s, quits)
        timeout-minutes: 3
        run: |
          dist/TwinKeys.app/Contents/MacOS/TwinKeys > smoke.log 2>&1 &
          PID=$!
          START=$(date +%s)
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then echo "TwinKeys exited early"; cat smoke.log; exit 1; fi
          # RSS counts shared system framework pages; "footprint" is what Activity Monitor shows as Memory.
          ps -o rss= -p $PID | awk '{printf "Resident (RSS): %.1f MB\n", $1/1024}' | tee memory.txt
          footprint -p $PID 2>/dev/null | grep -iE "^\s*(TwinKeys|Footprint|phys_footprint)|Footprint:" | head -5 | tee -a memory.txt || true
          vmmap --summary $PID 2>/dev/null | grep -iE "Physical footprint" | tee -a memory.txt || true
          kill -TERM $PID || true
          wait $PID || true
          cat smoke.log || true
          ls -la ~/Library/Logs/TwinKeys/ ~/Library/Application\ Support/TwinKeys/ || true
          cat ~/Library/Logs/TwinKeys/*.log || true
      - name: End-to-end check (network notes come out of the TwinKeys MIDI port)
        timeout-minutes: 5
        # macOS Local Network privacy silently blocks Bonjour for an .app that nobody can
        # answer the permission prompt for (CI has no user). The same build, run as a plain
        # executable from the shell, is not subject to it, so the check uses that binary.
        run: |
          # Both sides use the same (test-only) pairing code.
          export TWINKEYS_PAIRING_CODE=K7MQ2-WX9TP
          BIN=$(find .build -path '*Release/TwinKeys' -type f -perm +111 | head -1)
          echo "Using $BIN"
          "$BIN" > e2e-app.log 2>&1 &
          PID=$!
          sleep 3
          echo "--- Bonjour services seen by macOS (dns-sd, 5 s)"
          (dns-sd -B _twinkeys._udp local. & DPID=$!; sleep 5; kill $DPID) || true
          echo "--- UDP sockets of TwinKeys"
          lsof -nP -iUDP -a -p $PID || true
          set +e
          swift scripts/e2e-midi.swift 2>&1 | tee e2e.txt
          RESULT=${PIPESTATUS[0]}
          set -e
          kill -TERM $PID || true
          wait $PID || true
          echo "--- TwinKeys log"; cat ~/Library/Logs/TwinKeys/*.log || true
          exit $RESULT
      - name: Updater signature check rejects an app without the team's signature
        run: |
          if dist/TwinKeys.app/Contents/MacOS/TwinKeys --check-update-signature "$PWD/dist/TwinKeys.app" ABCDE12345; then
            echo "::error::accepted an unsigned app"; exit 1
          fi
      - name: Screenshots (light / dark)
        timeout-minutes: 3
        run: dist/TwinKeys.app/Contents/MacOS/TwinKeys --snapshot "$PWD/screenshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TwinKeys-app
          path: dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/*.png
            memory.txt
            e2e.txt
            *.log
            ~/Library/Logs/TwinKeys/*.log
          if-no-files-found: ignore

  bridge:
    name: Live Bridge script tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cd LiveBridge && python3 -m unittest -v

  site:
    name: Website builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    name: iPhone and iPad app (TwinKeys Remote) with its Apple Watch app
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: XcodeGen 2.46.0 (checked against its SHA-256)
        run: scripts/get-xcodegen.sh
      - name: Generate the Xcode project
        run: cd iOS && /tmp/xcodegen/bin/xcodegen generate
      - name: watchOS SDK and simulator (downloaded only if this runner lacks them)
        timeout-minutes: 25
        run: |
          xcodebuild -showsdks | grep -iE "watch" || true
          xcrun simctl list runtimes | grep -i "watchOS" || true
          if ! xcodebuild -showsdks | grep -q -- "-sdk watchsimulator"; then
            echo "No watchOS simulator SDK: downloading the watchOS platform"
            xcodebuild -downloadPlatform watchOS
          elif ! xcrun simctl list runtimes | grep -qi "watchOS"; then
            # Only the watch screenshots need the runtime; the build does not.
            xcodebuild -downloadPlatform watchOS || echo "::warning::watchOS simulator download failed (no watch screenshots)"
          fi
      - name: Build for the simulator
        run: |
          set -o pipefail
          # Which Xcodes this runner has (iPhone Duo's full screen needs the iOS 27.1 SDK).
          ls -d /Applications/Xcode*.app || true
          for x in /Applications/Xcode*.app; do echo "$x: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$x/Contents/Info.plist" 2>/dev/null)"; done
          xcodebuild -version
          xcodebuild -showsdks | grep -iE "iphoneos|watch" || true
          # No -sdk: it would force the iPhone SDK on the embedded watch app too. The destination picks the
          # iOS simulator for the iPhone app and the watchOS simulator for its watch app.
          xcodebuild -project iOS/TwinKeysRemote.xcodeproj -scheme TwinKeysRemote -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build-ios.log 2>&1 || { grep -E "error:|warning: .*deprecated" build-ios.log | sort -u | head -n 80; tail -n 30 build-ios.log; exit 1; }
          tail -n 5 build-ios.log
          test -d build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app
          ls build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app
          plutil -p build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/Info.plist
          grep -n "INFOPLIST\|PRODUCT_BUNDLE_IDENTIFIER" iOS/TwinKeysRemote.xcodeproj/project.pbxproj | head
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/Info.plist
          # App Store: the privacy manifest is copied into the app (XcodeGen puts unknown file types in Resources).
          test -f build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/PrivacyInfo.xcprivacy || { echo "::error::PrivacyInfo.xcprivacy is not in the app"; exit 1; }
          plutil -lint build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/PrivacyInfo.xcprivacy
          # 2.3: the Apple Watch app is built for the watchOS simulator and embedded in the iPhone app.
          WATCH=build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/Watch/TwinKeysRemoteWatch.app
          test -d "$WATCH" || { echo "::error::the watch app is not embedded"; ls -R build/Build/Products | head -n 40; exit 1; }
          plutil -p "$WATCH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH/Info.plist")" = io.github.kajisho5.twinkeys.remote
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WATCH/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app/Info.plist)"
          ls build/Build/Products/Debug-watchsimulator/TwinKeysRemoteWatch.app
      - name: Screenshots with sample data (iPhone and iPad, landscape and portrait, light and dark)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/TwinKeysRemote.app
          mkdir -p ios-screenshots
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith(sys.argv[1])))" "$1"; }
          for kind in "iPhone 17 Pro" "iPad Pro 13"; do
            UDID=$(pick "$kind" || pick "${kind%% *}")
            echo "== $kind: $UDID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            for look in light dark; do
              xcrun simctl ui "$UDID" appearance $look
              for turn in landscape portrait; do
                for pane in session mixer cues go; do
                  xcrun simctl terminate "$UDID" io.github.kajisho5.twinkeys.remote || true
                  if [ "$turn" = landscape ]; then
                    xcrun simctl launch "$UDID" io.github.kajisho5.twinkeys.remote -demo -pane $pane -landscape
                  else
                    xcrun simctl launch "$UDID" io.github.kajisho5.twinkeys.remote -demo -pane $pane
                  fi
                  sleep 5
                  xcrun simctl io "$UDID" screenshot "ios-screenshots/${kind// /-}-$turn-$pane-$look.png"
                done
              done
            done
            # The warning for a different backup set (2.1).
            xcrun simctl terminate "$UDID" io.github.kajisho5.twinkeys.remote || true
            xcrun simctl launch "$UDID" io.github.kajisho5.twinkeys.remote -demo -pane session -landscape -setdiff
            sleep 5
            xcrun simctl io "$UDID" screenshot "ios-screenshots/${kind// /-}-landscape-setdiff.png"
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la ios-screenshots
      - name: Apple Watch screenshots with sample data (GO, scenes, All Notes Off; English and Japanese)
        # The watch build is checked above; a runner without a watch simulator only skips these pictures.
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          WAPP=build/Build/Products/Debug-watchsimulator/TwinKeysRemoteWatch.app
          WID=io.github.kajisho5.twinkeys.remote.watchkitapp
          mkdir -p ios-screenshots
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith(sys.argv[1])))" "$1"; }
          UDID=$(pick "Apple Watch Series" || pick "Apple Watch")
          echo "== Apple Watch: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$WAPP"
          for lang in en ja; do
            for page in go scenes panic; do
              xcrun simctl terminate "$UDID" "$WID" || true
              xcrun simctl launch "$UDID" "$WID" -AppleLanguages "($lang)" -demo -page $page
              sleep 6
              xcrun simctl io "$UDID" screenshot "ios-screenshots/Apple-Watch-$page-$lang.png"
            done
          done
          xcrun simctl shutdown "$UDID" || true
          ls -la ios-screenshots | grep -i watch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-screenshots
          path: ios-screenshots/*.png
          if-no-files-found: ignore

