name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/help/**'
      - 'docs/privacy/**'
      - 'docs/support/**'
      - 'release-notes/**'
      - '.github/workflows/pages.yml'
  # After a release is published, so the download button and notes match what is out.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a Release run: only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The site may go out before a release (for example from the work branch): the download button and
      # the release notes must still match what is published, so notes of newer versions are left out.
      - name: Leave out release notes of versions not published yet
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$latest" ]; then echo "No published release found; keeping every note"; exit 0; fi
          echo "Latest published release: $latest"
          for f in release-notes/*/*.md; do
            v="$(basename "$f" .md)"
            if [ "$v" != "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n 1)" = "$v" ]; then
              echo "Not published yet, left out: $f"; rm "$f"
            fi
          done
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
