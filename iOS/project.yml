# XcodeGen 2.46.0 (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` makes TwinKeysRemote.xcodeproj.
# The project file is generated on CI, so it can be edited without a Mac.
name: TwinKeysRemote
options:
  bundleIdPrefix: io.github.kajisho5
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
# Shared by the iPhone app and the Apple Watch app (App Store Connect needs the same version and build in both).
settings:
  base:
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TwinKeys:
    path: ..
targets:
  TwinKeysRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: TwinKeys Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Landscape first: the iPhone layout is designed for landscape; portrait still works.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "TwinKeys Remote finds TwinKeys on your Macs on the local network to control Live."
        NSBonjourServices: [_twinkeys-remote._tcp]
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, ja]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kajisho5.twinkeys.remote
        PRODUCT_NAME: TwinKeysRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TwinKeys
        product: TwinKeysCore
      # 2.3: the Apple Watch app, copied into TwinKeysRemote.app/Watch ("Embed Watch Content").
      - target: TwinKeysRemoteWatch

  # 2.3 Apple Watch app (watchOS 10+). A single-target SwiftUI watch app (Xcode 14 and later):
  # product type com.apple.product-type.application on watchOS, with WKApplication and
  # WKCompanionAppBundleIdentifier in its Info.plist; no WatchKit extension target.
  # It talks only to the iPhone app (WatchConnectivity), never to the Macs, so it does not use TwinKeysCore.
  TwinKeysRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: TwinKeys
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations: [en, ja]
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.kajisho5.twinkeys.remote
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kajisho5.twinkeys.remote.watchkitapp
        PRODUCT_NAME: TwinKeysRemoteWatch
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        # Embedded in the iPhone app, not installed on its own (XcodeGen's watchOS preset says the same).
        SKIP_INSTALL: YES
