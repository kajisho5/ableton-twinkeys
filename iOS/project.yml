# XcodeGen 2.46.0 (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` makes TwinKeysRemote.xcodeproj.
# The project file is generated on CI, so it can be edited without a Mac.
name: TwinKeysRemote
options:
  bundleIdPrefix: io.github.kajisho5
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TwinKeys:
    path: ..
targets:
  TwinKeysRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        LSRequiresIPhoneOS: true
        CFBundleDisplayName: TwinKeys Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Landscape first: the iPhone layout is designed for landscape; portrait still works.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "TwinKeys Remote finds TwinKeys on your Macs on the local network to control Live."
        NSBonjourServices: [_twinkeys-remote._tcp]
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, ja]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kajisho5.twinkeys.remote
        PRODUCT_NAME: TwinKeysRemote
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TwinKeys
        product: TwinKeysCore
